name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # generative-ui-kit must build first — apps/playground typechecks
      # against its dist/ output, which doesn't exist on a fresh checkout.
      - run: pnpm --filter generative-ui-kit run build
      - run: pnpm run typecheck
      - run: pnpm run build
